<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inday Lyking POS & Order Tracker</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fce4ec; 
            text-align: center; 
            color: #444; 
            margin: 0;
            padding: 20px;
        }
        .container { 
            background: white; 
            width: 100%;
            max-width: 500px; 
            margin: 10px auto; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border: 2px solid #f06292; 
            box-sizing: border-box;
        }
        h2 { color: #d81b60; margin-bottom: 10px; }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        button { 
            background: #e91e63; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        button:hover { background: #c2185b; }
        .secondary-btn { background: #f06292; }
        .hidden { display: none; }
        
        /* POS Layout */
        .receipt { 
            text-align: left; 
            background: #fff5f8; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px; 
            border: 1px dashed #f06292; 
        }
        .item-entry { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
        .total-section { font-size: 20px; font-weight: bold; color: #d81b60; margin: 10px 0; }

        /* ORDER HISTORY / KITCHEN VIEW */
        .history-container {
            background: #fff;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ad1457;
            text-align: left;
        }
        .order-card {
            background: #fdf0f4;
            padding: 10px;
            border-left: 5px solid #e91e63;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 13px;
        }
        .order-header { font-weight: bold; color: #ad1457; border-bottom: 1px solid #ffc1e3; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container" id="loginPage">
        <h2>🍩 LOGIN</h2>
        <input id="loginEmail" type="text" placeholder="Email / Username">
        <input id="loginPass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button class="secondary-btn" onclick="showSignup()">Create New Account</button>
    </div>

    <div class="container hidden" id="signupPage">
        <h2>📝 SIGN UP</h2>
        <input id="signupEmail" type="text" placeholder="Enter Email">
        <input id="signupPass" type="password" placeholder="Enter Password">
        <button onclick="signup()">Register</button>
        <button class="secondary-btn" onclick="showLogin()">Back to Login</button>
    </div>

    <div id="posPage" class="hidden">
        <div class="container">
            <h2 style="margin:0;">INDAY LYKING</h2>
            <p style="margin:0 0 15px 0; font-weight:bold; color:#e91e63;">MINI DONUTS POS</p>

            <input id="customer" placeholder="Customer Name">

            <select id="package">
                <option value="Solo-Regular-25">Solo Regular (3pcs) - ₱25</option>
                <option value="Solo-Premium-30">Solo Premium (3pcs) - ₱30</option>
                <option value="Couple-Regular-55">Couple Regular (6pcs) - ₱55</option>
                <option value="Couple-Premium-60">Couple Premium (6pcs) - ₱60</option>
                <option value="Barkada-Regular-100">Barkada Regular (12pcs) - ₱100</option>
                <option value="Barkada-Premium-110">Barkada Premium (12pcs) - ₱110</option>
            </select>

            <select id="flavor">
                <option value="Chocolate">Chocolate</option>
                <option value="Strawberry">Strawberry</option>
                <option value="Matcha">Matcha</option>
                <option value="Ube">Ube</option>
                <option value="Milky">Milky</option>
            </select>

            <select id="topping">
                <optgroup label="Regular">
                    <option value="Rainbow Sprinkles">Rainbow Sprinkles</option>
                    <option value="Mini Mallows">Mini Mallows</option>
                    <option value="Crushed Grahams">Crushed Grahams</option>
                    <option value="Milk Powder">Milk Powder</option>
                    <option value="Powdered Sugar">Powdered Sugar</option>
                    <option value="Rice Crispies">Rice Crispies</option>
                </optgroup>
                <optgroup label="Premium">
                    <option value="Chocolate Chip">Chocolate Chip</option>
                    <option value="Sliced Almonds">Sliced Almonds</option>
                    <option value="Chocolate Nips">Chocolate Nips</option>
                    <option value="Crushed Cashew">Crushed Cashew</option>
                    <option value="Crushed Oreo">Crushed Oreo</option>
                </optgroup>
            </select>

            <input id="qty" type="number" value="1" min="1">
            <button onclick="addItem()">Add Item</button>

            <div class="receipt">
                <div id="list"><i>Current cart is empty...</i></div>
            </div>
            
            <div class="total-section" id="totalDisplay">Total: ₱0</div>

            <input id="payment" type="number" placeholder="Cash Amount">
            <button onclick="checkout()">Checkout & Save Order</button>
            <div id="changeDisplay" style="font-weight:bold; margin-top:5px;"></div>
            
            <button onclick="logout()" style="background:#757575; margin-top:10px;">Logout</button>
        </div>

        <div class="history-container">
            <h3 style="color:#ad1457; margin-top:0;">📋 KITCHEN ORDERS (Recent)</h3>
            <div id="orderHistory"><i>No orders processed yet.</i></div>
            <button onclick="clearHistory()" style="background:#ddd; color:#333; font-size:12px; padding:5px; margin-top:10px;">Clear Order History</button>
        </div>
    </div>

    <script>
        // --- AUTH ---
        function showSignup() { loginPage.classList.add("hidden"); signupPage.classList.remove("hidden"); }
        function showLogin() { signupPage.classList.add("hidden"); loginPage.classList.remove("hidden"); }

        function signup() {
            let email = signupEmail.value; let pass = signupPass.value;
            if(!email || !pass) { alert("Fill all fields!"); return; }
            let users = JSON.parse(localStorage.getItem("users")) || [];
            users.push({email, pass});
            localStorage.setItem("users", JSON.stringify(users));
            alert("Registered! You can login now.");
            showLogin();
        }

        function login() {
            let email = loginEmail.value; let pass = loginPass.value;
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let user = users.find(u => u.email === email && u.pass === pass);
            if(user) { loginPage.classList.add("hidden"); posPage.classList.remove("hidden"); renderHistory(); }
            else { alert("Invalid Login!"); }
        }

        function logout() { location.reload(); }

        // --- POS ENGINE ---
        let cart = [];
        let grandTotal = 0;

        function addItem() {
            let pkgData = document.getElementById("package").value.split("-");
            let qty = parseInt(document.getElementById("qty").value);
            let subtotal = parseInt(pkgData[2]) * qty;

            cart.push({
                desc: `${pkgData[0]} (${pkgData[1]})`,
                flavor: flavor.value,
                topping: topping.value,
                qty: qty,
                sub: subtotal
            });
            grandTotal += subtotal;
            renderCart();
        }

        function renderCart() {
            list.innerHTML = cart.length ? "" : "<i>Current cart is empty...</i>";
            cart.forEach(item => {
                list.innerHTML += `<div class="item-entry"><b>${item.qty}x ${item.desc}</b> - ₱${item.sub}<br><small>${item.flavor} | ${item.topping}</small></div>`;
            });
            totalDisplay.innerText = "Total: ₱" + grandTotal;
        }

        function checkout() {
            let cash = parseFloat(payment.value);
            if(cart.length === 0) return alert("Add items first!");
            if(isNaN(cash) || cash < grandTotal) return alert("Insufficient Cash!");

            let change = cash - grandTotal;
            changeDisplay.innerText = "Change: ₱" + change.toFixed(2);

            // SAVE TO HISTORY
            let history = JSON.parse(localStorage.getItem("order_history")) || [];
            let newOrder = {
                id: Date.now(),
                customer: customer.value || "Walk-in Customer",
                items: [...cart],
                total: grandTotal,
                time: new Date().toLocaleTimeString()
            };
            history.unshift(newOrder); // Add to top
            localStorage.setItem("order_history", JSON.stringify(history));

            alert("Order Saved to Kitchen!");
            
            // RESET
            cart = []; grandTotal = 0;
            customer.value = ""; payment.value = "";
            renderCart();
            renderHistory();
        }

        // --- HISTORY / KITCHEN VIEW ---
        function renderHistory() {
            let history = JSON.parse(localStorage.getItem("order_history")) || [];
            let historyDiv = document.getElementById("orderHistory");
            historyDiv.innerHTML = history.length ? "" : "<i>No orders processed yet.</i>";

            history.forEach(order => {
                let itemsHtml = order.items.map(i => `• ${i.qty}x ${i.desc} (${i.flavor} / ${i.topping})`).join("<br>");
                historyDiv.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">Customer: ${order.customer} | Time: ${order.time}</div>
                        ${itemsHtml} <br>
                        <strong>Total Paid: ₱${order.total}</strong>
                    </div>`;
            });
        }

        function clearHistory() {
            if(confirm("Burahin lahat ng orders sa kitchen?")) {
                localStorage.removeItem("order_history");
                renderHistory();
            }
        }
    </script>
</body>
</html>
