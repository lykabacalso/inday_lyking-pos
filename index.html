<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Online - Inday Lyking Mini Donuts</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; max-width: 450px; margin: auto; padding: 25px; border-radius: 20px; border: 3px solid #f06292; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { color: #d81b60; margin: 0 0 10px 0; }
        .section { text-align: left; background: #fff5f8; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffc1e3; }
        label { font-weight: bold; display: block; margin-top: 10px; color: #880e4f; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .check-item { background: white; padding: 8px; border-radius: 6px; border: 1px solid #eee; font-size: 13px; display: flex; align-items: center; cursor: pointer; }
        .cart-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; text-align: left; }
        .cart-table td { border-bottom: 1px solid #eee; padding: 8px 0; }
        .total-box { font-size: 26px; font-weight: bold; color: #e91e63; margin: 15px 0; }
        button { width: 100%; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-add { background: #ad1457; color: white; margin-bottom: 10px; }
        .btn-send { background: #2e7d32; color: white; }
        .disabled-box { opacity: 0.3; pointer-events: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="orderForm">
        <h2>INDAY LYKING 🍩</h2>
        <div class="section">
            <label>Customer Name:</label>
            <input type="text" id="custName" placeholder="Your Full Name">
        </div>

        <div class="section">
            <label id="limitLabel">Limit: 1 Flavor & 1 Topping</label>
            <select id="pkgSelect" onchange="updateRules()">
                <option value="25-1-Regular">Solo Regular - ₱25</option>
                <option value="30-1-Premium">Solo Premium - ₱30</option>
                <option value="55-2-Regular">Couple Regular - ₱55</option>
                <option value="60-2-Premium">Couple Premium - ₱60</option>
                <option value="100-3-Regular">Barkada Regular - ₱100</option>
                <option value="110-3-Premium">Barkada Premium - ₱110</option>
            </select>

            <label>Flavors:</label>
            <div class="grid">
                <label class="check-item"><input type="checkbox" class="flavor-cb" value="Choco"> Choco</label>
                <label class="check-item"><input type="checkbox" class="flavor-cb" value="Straw"> Straw</label>
                <label class="check-item"><input type="checkbox" class="flavor-cb" value="Matcha"> Matcha</label>
                <label class="check-item"><input type="checkbox" class="flavor-cb" value="Ube"> Ube</label>
                <label class="check-item"><input type="checkbox" class="flavor-cb" value="Milky"> Milky</label>
            </div>

            <label>Regular Toppings:</label>
            <div class="grid" id="regBox">
                <label class="check-item"><input type="checkbox" class="top-cb" value="Sprinkles"> Sprinkles</label>
                <label class="check-item"><input type="checkbox" class="top-cb" value="Mallows"> Mallows</label>
                <label class="check-item"><input type="checkbox" class="top-cb" value="Grahams"> Grahams</label>
            </div>

            <label>Premium Toppings:</label>
            <div class="grid" id="premBox">
                <label class="check-item"><input type="checkbox" class="top-cb" value="ChocoChip"> ChocoChip</label>
                <label class="check-item"><input type="checkbox" class="top-cb" value="Almonds"> Almonds</label>
                <label class="check-item"><input type="checkbox" class="top-cb" value="Oreo"> Oreo</label>
            </div>
            <button class="btn-add" onclick="addToList()">+ ADD TO LIST</button>
        </div>

        <div class="section" style="background: white;">
            <table class="cart-table"><tbody id="cartItems"></tbody></table>
            <div class="total-box" id="totalDisplay">Total: ₱0</div>
            <button id="sendBtn" class="btn-send" onclick="sendOrder()">SEND ORDER</button>
        </div>
    </div>

    <div class="container hidden" id="successScreen">
        <h2 style="color: #4CAF50;">Order Sent! ✔</h2>
        <p>Pakipunta sa counter para magbayad. Thank you!</p>
        <button onclick="location.reload()" style="background: #757575; color:white;">New Order</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://inday-lyking-pos-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cart = []; let limit = 1; let type = "Regular";

        function updateRules() {
            let val = pkgSelect.value.split("-");
            limit = parseInt(val[1]); type = val[2];
            limitLabel.innerText = `Limit: ${limit} Flavor & ${limit} Topping`;
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            if(type === "Regular") { regBox.classList.remove("disabled-box"); premBox.classList.add("disabled-box"); }
            else { premBox.classList.remove("disabled-box"); regBox.classList.add("disabled-box"); }
        }

        document.addEventListener('change', function(e) {
            if(e.target.classList.contains('flavor-cb') && document.querySelectorAll('.flavor-cb:checked').length > limit) { alert("Limit reached!"); e.target.checked = false; }
            if(e.target.classList.contains('top-cb') && document.querySelectorAll('.top-cb:checked').length > limit) { alert("Limit reached!"); e.target.checked = false; }
        });

        function addToList() {
            let f = Array.from(document.querySelectorAll('.flavor-cb:checked')).map(cb => cb.value);
            let t = Array.from(document.querySelectorAll('.top-cb:checked')).map(cb => cb.value);
            if(f.length === 0 || t.length === 0) return alert("Select Flavor & Topping!");
            cart.push({ pkg: pkgSelect.options[pkgSelect.selectedIndex].text, price: parseInt(pkgSelect.value), desc: `F: ${f.join(",")} | T: ${t.join(",")}` });
            renderCart();
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        }

        function renderCart() {
            let h = ""; let total = 0;
            cart.forEach((item, i) => {
                h += `<tr><td><b>${item.pkg}</b><br>${item.desc}</td><td>₱${item.price}</td><td><button onclick="cart.splice(${i},1);renderCart()" style="background:red;color:white;border:none;">X</button></td></tr>`;
                total += item.price;
            });
            cartItems.innerHTML = h; totalDisplay.innerText = "Total: ₱" + total;
        }

        function sendOrder() {
            if(!custName.value || cart.length === 0) return alert("Enter Name & Add Items!");
            sendBtn.disabled = true; sendBtn.innerText = "Sending...";
            db.ref("orders").push({
                customer: custName.value,
                package: cart.map(i => i.pkg).join("<br>"),
                flavors: cart.map(i => i.desc).join("<br>"),
                total: totalDisplay.innerText,
                timestamp: Date.now()
            }).then(() => {
                orderForm.classList.add("hidden"); successScreen.classList.remove("hidden");
            });
        }
        updateRules();
    </script>
</body>
</html>
